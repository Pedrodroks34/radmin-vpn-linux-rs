[package]
name = "radmin-vpn"
version = "0.1.0"
edition = "2021"
description = "Cliente Linux nativo do Radmin VPN (engineering reverse, interoperável com infraestrutura oficial)"
authors = ["radmin-vpn-linux project"]
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }

rtnetlink = "0.7"

socket2 = "0.5"

reqwest = { version = "0.11", features = ["json"] }

openssl = "0.10"
libc = "0.2"

ring = "0.16"
rustls = { version = "0.23", features = ["ring"] }

clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
bytes = "1"
serde_json = "1"
toml = "0.8"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

thiserror = "1"
anyhow = "1"

uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
anyhow = "1"

[workspace]